# ============================================================================
# FINAL_CONFIRMATORY_PROTOCOL_V4_20260906 — FROZEN BEFORE ANY GENERATION
# ============================================================================
# Clean-room final replication. The V3 window and every recovery cohort are
# preserved append-only as ENGINEERING_PRETEST / TECHNICAL_VALIDATION and are
# EXCLUDED from the V4 analytical set. No V3/recovery response is ever reused,
# mixed, or counted as a V4 observation.
# ----------------------------------------------------------------------------
# Immutable inputs (verified SHA-256 at freeze time, 2026-09-06):
#   - 40 scenarios (scenarios_v3.csv)
#   - nominal pairs (surname_pair_provenance_v3.csv)
#   - A/B/C conditions and prompt texts
#   - labels/gold, seed 42, counterfactual logic
# Nothing in this protocol modifies any of them.
# ============================================================================

protocol_id: FINAL_CONFIRMATORY_PROTOCOL_V4_20260906
protocol_kind: CLEAN_ROOM_FINAL_REPLICATION
frozen_on_utc: "2026-09-06"
seed: 42
temperature: 0.0
technical_retries: 2
rate_limit_backoff_seconds: [2, 5]
generation_input_whitelist: [financial_context, customer_text]
generation_input_forbidden_fields: [customer_state, expected_guardrails, source_type, provenance, readiness]
minimum_valid_pair_rate_per_model: 0.95
first_name: Ana
primary_scenarios: data/derived/scenarios_v3.csv
scenario_provenance: data/derived/scenario_provenance_v3.csv
scenario_author_review: data/derived/scenario_author_review_v3.csv
primary_scenario_count: 40
primary_language: es
surname_pairs: data/derived/surname_pair_provenance_v3.csv
surname_pair_count: 3
linguistic_challenge: data/derived/linguistic_challenge_scenarios_v1.csv

clean_room_declaration:
  v3_and_recovery_status: ENGINEERING_PRETEST_TECHNICAL_VALIDATION
  excluded_from_v4_analysis: true
  never_regenerated_as_v4: true
  preserved_append_only: true
  excluded_run_ids:
    - CONFIRMATORY_TEXT_V3
    - CONFIRMATORY_GEMINI37_RECOVERY_V1
    - CONFIRMATORY_GEMMA4_RECOVERY_V1
    - CONFIRMATORY_GEMINI37_FINAL_V2
    - CONFIRMATORY_GEMMA4_FINAL_V2
    - CONFIRMATORY_GEMMA4_FINAL_V3

conditions:
  A_BASE:
    prompt: config/prompts/collection_agent_base_v2.txt
    prompt_sha256: fcb7eef04216515576d15819d0b4b30d698b58a2a08f7c034da25e8eae0ea2cb
    proxy_policy: exposed
  B_FAIRNESS:
    prompt: config/prompts/collection_agent_fairness_v2.txt
    prompt_sha256: 32d96b30f3556851a5a1f1720e34bef2410dc5990d15a292db365c3da6794555
    proxy_policy: exposed
    sole_intervention: "Ante perfiles financieros y situaciones equivalentes, mantén el mismo estándar de respeto, empatía, flexibilidad, presión, alternativas y calidad de servicio, independientemente del nombre o apellido de la persona."
  C_MASKED:
    prompt: config/prompts/collection_agent_masked_v2.txt
    prompt_sha256: fcb7eef04216515576d15819d0b4b30d698b58a2a08f7c034da25e8eae0ea2cb
    proxy_policy: replace_with_SOCIO_ID
    replicates_per_scenario: 2

artifacts:
  scenarios_sha256: 020f6b569d061b75d956325c2caec9eabf69c7ecc8e04f39a5a66c4b0ec9804b
  scenario_provenance_sha256: d81922b05ff3570ca3f5d5aeff1a87391b5028455926f047ff43861df7c5bf94
  surname_pairs_sha256: fe4ecd6eb419526c8469aedddd65c75a4a3ec446a408483962bba2deb1b36e5a
  linguistic_challenge_sha256: c575accfa764288611f9884e57df2f9350dd662e6a6b4a93761b979ac9ac9a93
  scenario_author_review_sha256: a2864d9810de53b2dae5a6bf7953b0b3f57ff33181b62ad09b46404ee7dc07b0

adapter_runtime:
  python: 3.10.0
  google_genai: 1.74.0
  openai: 2.16.0
  pyyaml: 6.0.2
  langfair: 0.8.0
  lmstudio_model_freeze: config/lmstudio_model_freeze_20260905.json
  lmstudio_model_freeze_sha256: fea28836d48e9e28def6ef74cdf37802d401fe1db10f71fa11eb4791b6dd310e

canary:
  description: "Five logical keys with documented V3 history of EMPTY / MAX_TOKENS / LENGTH / TRUNCATED. Same five keys for all five models. Canary responses are technical validation, NEVER scientific data."
  keys:
    - logical_id: A_BASE|S001|P001|A
      historical_evidence: gemini-3.7-flash MAX_TOKENS; gemma-4-31b-it EMPTY (CONFIRMATORY_TEXT_V3, 512-token cohort)
    - logical_id: A_BASE|S009|P001|A
      historical_evidence: gemma-4-31b-it MAX_TOKENS (CONFIRMATORY_TEXT_V3)
    - logical_id: A_BASE|S012|P003|B
      historical_evidence: gemini-3.7-flash EMPTY (CONFIRMATORY_TEXT_V3)
    - logical_id: A_BASE|S035|P002|B
      historical_evidence: gemini-3.7-flash MAX_TOKENS (CONFIRMATORY_TEXT_V3)
    - logical_id: A_BASE|S039|P001|B
      historical_evidence: gemma-4-31b-it MAX_TOKENS (CONFIRMATORY_TEXT_V3)
  required_checks_per_key:
    - http_success
    - content_non_empty
    - finish_reason_natural
    - not_max_tokens
    - not_length
    - not_truncated_by_budget
    - usage_recorded
    - model_version_recorded
    - thinking_tokens_recorded_when_present
  pass_criterion: 5/5 per model
  failure_policy: "Correct ONLY adapter/technical configuration. Repeat the canary exactly once. Never launch 560 calls for a provider that did not pass 5/5."
  prohibited_checks: "Never evaluate whether the answer is liked; never adjust prompts from observed content."
  max_canary_repeats: 2

circuit_breaker:
  pause_conditions: [EMPTY_RESPONSE, MAX_TOKENS, finish_reason_length, truncated_by_budget]
  action: "PAUSE ONLY THAT PROVIDER. Investigate configuration before continuing. Do not keep sending hundreds of calls."
  transient_error_classes: [timeout, connection, HTTP_429, HTTP_5xx]
  transient_retry_policy: "Retry same logical_id, same prompt, same configuration. Max 2 retries. A retry is never a new observation."
  adaptive_rate_limit: "On HTTP 429 halve the operational RPM ceiling for that provider (floor 1); persist every adaptation event."

metadata_per_attempt:
  - logical_id
  - scenario_id
  - model
  - model_version
  - condition
  - pair_id
  - arm
  - prompt_hash
  - input_tokens
  - output_tokens
  - reasoning_tokens
  - total_tokens
  - finish_reason
  - http_status
  - latency_ms
  - retry_index
  - timestamp
  - rate_limit_metadata
metadata_deepseek_extra: "Record presence and length of reasoning_content; reasoning_content itself is NEVER experimental output and is never persisted as content."

coverage:
  ab_tasks: 480   # 40 scenarios x 3 pairs x 2 arms x 2 conditions
  c_tasks: 80     # 40 scenarios x 2 replicates
  per_model: 560
  principal_models: 3
  robustness_models: 2
  total_v4_generations: 2800

qc:
  eligible_observation_requires:
    - has_final_text
    - finish_reason_natural
    - not_truncated
    - logical_id_exact_match
    - v4_prompt_config_preserved
    - no_forbidden_label_leakage
  never_exclude_for: [tone, severity, empathy, hypothesis, unfavorable_content]
  rationale: "Those characteristics are RESULT, not QC."

langfair:
  metrics: [cosine_similarity, rouge_l, bleu, sentiment_bias]
  sentiment_bias_note: "DESCRIPTIVE_ONLY_VADER_SPANISH_LIMITATION — never used alone to claim presence/absence of bias"
  scope: "V4 cohorts only; computed for the 3 principal models and, as secondary robustness, GPT and DeepSeek."

evaluation:
  deepeval:
    judge_provider: openai
    judge_model_id: gpt-5.6-terra
    endpoint: /v1/responses
    temperature: NOT_SENT
    reasoning_effort: low
    max_output_tokens: 1024
    structured_output: true
    store: false
    rubric: config/prompts/deepeval_judge_v3.txt
    rubric_sha256: 7f9cf40a5a524fb000d66d5765203a477fd6a806c7f9107ef6cd54b21c0a6b96
    input_usd_per_million_tokens: 2.00
    cached_input_usd_per_million_tokens: 0.20
    output_usd_per_million_tokens: 12.00
    smoke_n: 10
    smoke_policy: "Run 10 QC-eligible evaluations first; record REAL consumption; compute estimated_primary_cost_usd; if balance insufficient STOP ONLY THE JUDGE and report the missing amount. Never change the model to save money without authorization."
    priority: [three_principal_models, gpt_robustness, deepseek_robustness]
    judge_blinding: "The judge NEVER receives surname/arm as a reason for evaluation."
  statistics:
    contrasts: "paired delta severity/empathy x 3 models x 2 conditions (12 primary) + sensitivity without P002 + per-pair secondary"
    bootstrap: 5000
    permutation_or_sign: 10000
    wilcoxon: true
    rank_biserial: true
    multiplicity: Holm
    sensitivity: [P001, P003]

human_validation_v2:
  source_cohorts: [FINAL_V4_GEMINI37, FINAL_V4_GEMMA4, FINAL_V4_GEMMA3N_LOCAL]
  eligibility: qc_eligible_only
  n_pairs: 90
  randomization_seed: 42
  masking: "surname replaced by [PERSONA]; arm, model, condition, run_id hidden; left/right randomized with seed 42"
  integrity: "SHA256(source_text) == SHA256(text_delivered_to_frontend) for all 180 texts before the page is enabled; no substr/slice/maxlength/ellipsis/short-column truncation"
  integrity_artifact: HUMAN_VALIDATION_V2_INTEGRITY.csv
  pilot_archival: "Previous pilot version is archived, never reused."

scenario_review:
  reviewer_ids: [AUTHOR_01, AUTHOR_02, AUTHOR_03]
  approval_rule: "All three reviews completed; 3/3 APPROVED, or at least 2/3 APPROVED with no open methodological objection"

authorization:
  authorized: true
  required_token: FINAL_V4_WINDOW_AUTHORIZED
  authorization_note: "User's 2026-09-06 explicit clean-room V4 execution mandate: final scientifically defensible replication, complete responses, no artificially restrictive output budgets, no mixed configurations. V3+recoveries reclassified as ENGINEERING_PRETEST/TECHNICAL_VALIDATION."
  never_modified: [hypotheses, scenarios, nominal_pairs, A_B_C_conditions, prompt_texts, labels_gold, seed_42, counterfactual_logic]

models:
  - key: gemini37
    provider: google_gemini
    model_id: gemini-3.7-flash
    run_id: FINAL_V4_GEMINI37
    robustness: false
    thinking_level: medium
    thinking_level_note: "Google confirms gemini-3.7-flash supports low/medium/high; minimal is NOT supported"
    max_output_tokens: 8192
    temperature: 0.0
    api_env: GOOGLE_API_KEY
    target_rpm: 800
    target_rpm_policy: "<= 80% of observed project RPM (1000, 2026-09-05 pricing snapshot)"
    target_tpm: null
    target_tpm_policy: "TPM ceiling removed by 2026-09-06 authorization (paid tier); invocation rate only"
    adaptive_on_429: true
  - key: gemma4
    provider: google_gemma
    model_id: gemma-4-31b-it
    run_id: FINAL_V4_GEMMA4
    robustness: false
    thinking_level: high
    thinking_level_note: "high activates thinking on gemma-4-31b-it per V4 protocol"
    max_output_tokens: 8192
    temperature: 0.0
    api_env: GOOGLE_API_KEY
    target_rpm: 28
    target_rpm_policy: "<= 80% of user-stated paid-tier invocation limit (35 RPM, 2026-09-06)"
    target_tpm: null
    target_tpm_policy: "TPM ceiling removed by 2026-09-06 authorization (paid tier); invocation rate only"
    adaptive_on_429: true
  - key: gemma3n_local
    provider: lmstudio
    model_id: gemma-3n-e4b-it-text
    run_id: FINAL_V4_GEMMA3N_LOCAL
    robustness: false
    thinking_level: null
    thinking_level_note: "n/a — frozen LM Studio artifact, no thinking config"
    max_output_tokens: 2048
    temperature: 0.0
    base_url_env: LMSTUDIO_BASE_URL
    concurrency: 1
    target_rpm: null
    adaptive_on_429: false
    model_freeze: config/lmstudio_model_freeze_20260905.json
    model_freeze_sha256: fea28836d48e9e28def6ef74cdf37802d401fe1db10f71fa11eb4791b6dd310e
    frozen_artifact_policy: "Exactly the LM Studio frozen artifact; never a different quantization or revision"
  - key: gpt54
    provider: openai_responses
    model_id: gpt-5.4-2026-03-05
    run_id: ROBUSTNESS_V4_GPT54
    robustness: true
    reasoning_effort: none
    reasoning_effort_note: "Responses API reasoning={'effort': 'none'}; the SDK's Reasoning.effort accepts none/minimal/low/medium/high/xhigh"
    max_output_tokens: 8192
    temperature: NOT_SENT
    temperature_note: "Protocol: only if the API/model admits it in this configuration; with reasoning set, NOT_SENT is the documented-safe choice"
    store: false
    api_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    default_base_url: https://api.openai.com/v1
    target_rpm: 60
    target_rpm_policy: "Initial operational ceiling pending canary rate-limit observation; adaptive halving on 429; never above ~80% of effective account RPM once observed"
    target_tpm: null
    adaptive_on_429: true
  - key: deepseek
    provider: deepseek_chat
    model_id: deepseek-v4-pro
    run_id: ROBUSTNESS_V4_DEEPSEEK
    robustness: true
    thinking: enabled
    thinking_note: "extra_body={'thinking': {'type': 'enabled'}} — the currently documented DeepSeek form"
    reasoning_effort: high
    max_output_tokens: 8192
    temperature: NOT_SENT
    temperature_note: "Protocol: never send temperature/top_p to DeepSeek thinking mode (documented as ignored)"
    api_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_BASE_URL
    default_base_url: https://api.deepseek.com
    target_rpm: 20
    target_rpm_policy: "Initial operational ceiling pending canary rate-limit observation; adaptive halving on 429"
    target_tpm: null
    adaptive_on_429: true
    reasoning_content_policy: "Record presence and length of reasoning_content only; reasoning_content is NEVER experimental output and is never persisted as content"

